name: tests
on:
  push:
  pull_request:
jobs:
  core-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check modules
        run: for f in noise.js blocks.js world.js game.js persistence.js; do node --check "$f"; done
      - name: Run core logic tests
        run: npm test
